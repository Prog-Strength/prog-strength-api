# prog-strength-api configuration — single source of truth.
#
# This file is PUBLIC. It contains tuning knobs and non-sensitive config
# ONLY. It never contains secrets.
#   • literal value  → public, version-controlled config. Edit + review + deploy.
#   • "${ENV_VAR}"   → supplied by the environment at runtime. Used for
#                      secrets (GitHub secrets), Terraform-owned resource
#                      identities, and PII. A label here, never a value.
#
# Resolution precedence (highest wins):
#   1. explicit env override for a key (emergency tuning without a rebuild)
#   2. ${VAR} interpolation from the environment
#   3. the literal value below
#   4. built-in default / required-missing is a startup error
#
# CONFIG_FILE may point at an external file to replace this embedded default.

[server]
addr = ":8080"
# Mounts POST /auth/dev/token. Local/dev only — MUST be false in production.
# Not a secret; local dev overrides with env DEV_AUTH=true.
dev_auth = false

[database]
# Container path to the app SQLite DB. Local dev overrides via env.
url = "/data/app.db"
# Empty → sibling telemetry.db next to `url` (e.g. /data/telemetry.db).
telemetry_url = ""

[logging]
# debug | info | warn | error. Public tunable (was a compose default).
level = "info"

[auth]
# HMAC secret for signing/verifying JWTs. REQUIRED — secret → env.
jwt_signing_key = "${JWT_SIGNING_KEY}"
# Operator allowlist gating /admin/*. PII → env (NOT committed). Empty =
# admin surface fail-closed (every /admin route 403s).
admin_emails = "${ADMIN_EMAILS}"

[auth.google]
# OAuth client id: deployment-bound identifier (not a hard secret) → env.
client_id = "${GOOGLE_CLIENT_ID}"
# OAuth client secret → secret → env.
client_secret = "${GOOGLE_CLIENT_SECRET}"
# Public OAuth callback URLs — NOT secrets. Prod literals; local dev
# overrides via env. Empty client_id/secret/redirect ⇒ Google login routes
# are not mounted (local-only iteration with dev_auth).
login_redirect_url = "https://api.progstrength.fitness/auth/google/callback"
calendar_redirect_url = "https://api.progstrength.fitness/auth/google/calendar/callback"
# base64 32-byte AES-256-GCM key encrypting stored Google refresh tokens.
# Secret → env. Empty disables Google Calendar sync.
calendar_token_enc_key = "${CALENDAR_TOKEN_ENC_KEY}"

[whoop]
# OAuth client id: deployment-bound identifier (not a hard secret) → env.
client_id = "${WHOOP_CLIENT_ID}"
# OAuth client secret (also the webhook HMAC key) → secret → env.
client_secret = "${WHOOP_CLIENT_SECRET}"
# Public OAuth callback URL — NOT a secret. Prod literal; local dev via env.
redirect_url = "https://api.progstrength.fitness/auth/whoop/callback"
# base64 32-byte AES-256-GCM key encrypting stored Whoop tokens. Secret → env.
# Empty disables the Whoop integration.
token_enc_key = "${WHOOP_TOKEN_ENC_KEY}"

[calendar_sync]
# Google Calendar sync of LOGGED activities (internal/calendarsync). Public
# literals — not secrets, not env-overridden. The one real secret in this
# feature is calendar_token_enc_key under [auth].
#
# enabled is the kill switch. Turning it off stops every sync hook and the
# boot reconciler without touching OAuth: users stay connected, planned-workout
# scheduling keeps working, and flipping it back resumes where things left off
# (the reconciler picks up everything logged in the meantime).
enabled = true
# Cap on repair writes issued by one boot's reconciler pass. Unlike the
# timeline reconciler — which only writes to our own SQLite — this one makes
# real Google Calendar API calls, so an unbounded pass after a long outage
# could hit rate limits and get the whole integration throttled. The pass
# drains oldest-first and logs the remainder, so a backlog larger than this
# clears over successive boots instead of being silently dropped.
reconcile_max_per_boot = 200
# Consecutive failures after which an activity stops being retried. Protects
# against an activity Google will never accept (a malformed render, say)
# burning a write on every boot forever. A successful sync resets the count.
max_attempts = 5

[cors]
# Browser origins permitted credentialed access. Public domains — NOT
# secrets. Each entry may contain a SINGLE "*" wildcard (Vercel previews).
# Empty disables CORS. Local dev appends localhost via env override.
allowed_origins = [
  "https://progstrength.fitness",
  "https://prog-strength-web-*-jimmy-wallaces-projects.vercel.app",
]
# Origins /auth/google/login may redirect back to via ?return_to. Public.
# Superset of [cors] allowed_origins: every credentialed browser origin must
# be able to complete login, plus non-browser callbacks that are never an
# Origin header.
#
# "progstrength://" is the mobile app's custom scheme. It is the whole origin,
# not a typo for "progstrength://auth/callback": the deep link the app sends is
# expo-linking's "progstrength:///auth/callback", which has no authority
# component, so scheme + host is the bare scheme. A path-carrying entry here
# would never match. See manifest_test.go.
return_to_allowed_origins = [
  "https://progstrength.fitness",
  "https://prog-strength-web-*-jimmy-wallaces-projects.vercel.app",
  "progstrength://",
]

[storage]
# S3 buckets are provisioned by Terraform — it owns these names. Env-sourced
# from Terraform outputs; NOT committed as literals (would duplicate TF).
# Empty → in-memory fallback (uploads vanish on restart; DB rows survive).
avatar_bucket_name = "${AVATAR_BUCKET_NAME}"
tcx_bucket_name = "${TCX_BUCKET_NAME}"   # folded in from the former stray os.Getenv
photo_bucket_name = "${PHOTO_BUCKET_NAME}"   # activity photos (Terraform-owned)
video_bucket_name = "${VIDEO_BUCKET_NAME}"   # activity videos (Terraform-owned)
# AWS region for the S3 clients. Terraform-owned; REQUIRED when a bucket is set.
aws_region = "${AWS_REGION}"

[photos]
# Tunables for the Activity Photos feature (internal/photos). Public literals —
# not secrets, not env-overridden. max_per_activity caps photos per activity;
# max_upload_bytes is the raw-upload size ceiling; full_/thumb_* define the two
# derived JPEG renditions (max edge in px + quality); presign_window_hours is a
# presigned URL's lifetime; caption_max_chars bounds a caption's length.
#
# Fidelity policy: a JPEG upload is STORED AS THE USER'S ORIGINAL BYTES. The
# worker rewrites its metadata in place — keeping only the ICC profile and EXIF
# Orientation, dropping GPS, XMP, IPTC, MakerNote and comments — without
# touching the entropy-coded scan data. Dropping the source's location data is
# still the privacy mechanism, and still unconditional; it just no longer costs
# a re-encode.
#
# This block used to say the `full` variant was "the ARCHIVAL copy... the best
# copy that will ever exist". It was the opposite: re-encoding an already-lossy
# JPEG is generation loss, the output ran ~28% LARGER than its input, and
# image/jpeg emits no APP2, so every ICC profile was silently discarded and
# wide-gamut photos were stored as sRGB. See
# sows/photo-upload-direct-to-s3.md.
#
# PNG and WebP still go through the re-encode — a deliberate v1 scope decision
# (one new container parser rather than three), which is why the full_* knobs
# below still exist.
max_per_activity     = 10
# 32 MiB. Covers any phone/camera JPEG with headroom (a 24MP JPEG is ~8-12 MB).
#
# NOT enforced by a request-body cap any more: the bytes go browser->S3 through
# a presigned PUT and never reach this process, so the presign carries a
# content-length-range and the commit step re-HEADs the object to check the
# real size. The old rationale here (ParseMultipartForm's maxMemory bounding
# per-request RAM on a shared host) no longer applies.
#
# HEIC is NOT covered, despite what this comment used to claim. Go's
# http.DetectContentType implements WHATWG mimesniff, which has no HEIC branch,
# so an ISOBMFF file sniffs as application/octet-stream and is rejected 415
# before size is ever consulted. Tracked in issue #105.
max_upload_bytes     = 33554432
# APPLIES TO PNG/WebP AND THE JPEG FALLBACK ONLY. A JPEG that strips and
# verifies cleanly is never re-encoded, so neither this nor full_jpeg_quality
# touches it. They still govern PNG/WebP sources, and a JPEG whose rewrite
# fails verification (watch api_photo_strip_fallback_total).
#
# NO DOWNSCALE. 20000 equals maxDecodeEdge in photo_pipeline.go, so nothing the
# decoder accepts is ever resized — `resize` returns the source untouched when
# both edges already fit. The decode guard, not this number, is the real
# ceiling.
#
# This was 2048, which threw away 75% of a 12MP phone photo's pixels (4032x3024
# -> 2048x1536) and ~94% of a 48MP one. That clamp, not the JPEG quality, was
# the dominant cause of soft stored photos.
full_max_edge_px     = 20000
# Near-lossless. Above ~95 JPEG buys file size rather than visible fidelity;
# below ~90 the artifacts are findable on a detailed photo at full zoom.
full_jpeg_quality    = 95
# The thumb feeds the timeline cover and the detail strip — the images actually
# looked at most often. 480 visibly softened on a retina display; 800 is sharp
# there while keeping a feed screen's worth of covers cheap.
thumb_max_edge_px    = 800
thumb_jpeg_quality   = 85
presign_window_hours = 6
caption_max_chars    = 200
# --- two-phase upload (see sows/photo-upload-direct-to-s3.md) ---
# Lifetime of the presigned PUT the client uploads its original to. Generous
# enough for a 32 MiB photo on a slow connection, short enough that an
# abandoned reservation is reaped promptly.
upload_url_ttl_minutes = 15
# How many times the worker will pick up one photo before giving up. The
# counter increments at CLAIM time, so a photo that kills the worker outright
# is still bounded by this.
process_max_attempts = 3
# Worker poll interval. Short because the user is watching a placeholder on the
# activity page while it runs; the drain loop means a burst does not take one
# tick per photo.
process_tick_seconds = 2
# How long a reservation may sit unused before the reaper retires it and
# deletes its staged object. Comfortably longer than the presign TTL, so a
# slow-but-live upload is never reaped out from under itself.
reap_after_minutes = 30

[videos]
# Tunables for the Activity Videos feature. Public literals — not secrets, not
# env-overridden. See sows/activity-videos.md.
#
# There are deliberately NO quality or dimension knobs for the video itself:
# nothing is transcoded, and the stored object is byte-identical to what the
# user uploaded. The only derived artifact is the poster JPEG, which the client
# generates and the server bounds through the existing image pipeline.
max_per_activity = 10
# 1 GiB. Enforced by S3 against the presigned upload's content-length-range and
# re-checked by a HEAD at commit — NOT by a request-body cap, because the bytes
# never reach this process. That is the whole point of the direct-to-S3 path:
# buffering a file this size in RAM on a shared 4 GB host is not viable, and
# the ceiling would move with the instance type rather than with the product.
max_upload_bytes = 1073741824
# Container allowlist. mp4 and quicktime cover every phone and camera that
# matters; HEVC inside those containers is accepted and flagged for playback
# rather than rejected — losing a moment the user can't re-record is worse than
# a playback caveat (sows/activity-videos.md, Open Question 1).
allowed_content_types = ["video/mp4", "video/quicktime"]
# Playback URL lifetime. Matches photos so the same windowed presigner keeps
# minting cache-stable URLs.
presign_window_hours = 6
# How long a reservation's upload target stays valid. Generous enough for a
# 1 GiB upload on a slow connection without leaving signed write URLs alive.
upload_url_ttl_minutes = 60
# The client-generated poster, bounded server-side. Larger than the photo thumb
# because a poster is displayed at strip size AND as the pre-play frame.
poster_max_edge_px  = 1280
poster_jpeg_quality = 88
caption_max_chars   = 200
# A reservation whose client vanished mid-upload leaves a pending row and maybe
# an object. Older than this, the reaper soft-deletes the row and tags the
# object for the bucket's existing lifecycle rule.
pending_reap_after_hours = 24

[avatar]
# Tunable for the profile-avatar upload (POST /me/avatar). Public literal —
# not a secret, not env-overridden.
#
# 5 MiB. The bytes land in this process (unlike videos): uploadAvatar reads the
# whole file into a byte slice to sniff its content type and hand it to S3, so
# this is a per-request memory bound as much as a product one. It sits well
# below the photo ceiling because clients crop and re-encode an avatar to a
# small square before uploading — the limit exists for the SOURCE photo a user
# picks, and 5 MiB comfortably covers a phone camera JPEG.
max_upload_bytes = 5242880

[usage]
# Per-user daily external-API spend ceiling (USD). 0 = disabled. Public
# tunable — moved out of compose. ~$20/user/month at 0.67.
daily_cap_usd = 0.67
# Optional override of usage.DefaultPriceTable (emergency escape hatch).
# Empty = built-in defaults. Public rates live in source as reviewable diffs.
price_table = ""

[nutrition_lookup]
# Provider credentials → secrets → env. Empty ⇒ provider skipped and
# GET /nutrition/lookup degrades to 503/agent estimation.
fatsecret_client_id = "${FATSECRET_CLIENT_ID}"
fatsecret_client_secret = "${FATSECRET_CLIENT_SECRET}"
usda_fdc_api_key = "${USDA_FDC_API_KEY}"

[weather]
# Master kill switch, mirroring [calendar_sync].enabled. false ⇒ no provider
# calls, no geocoding, no budget consumption; every /weather route returns
# status "disabled" and the tile says so plainly. Flipping it back resumes
# immediately — nothing to reconcile, because nothing is persisted but cache.
enabled = true

# OpenWeather One Call 4.0 + Geocoding. The one real secret here → env.
# Empty ⇒ the integration behaves exactly as if enabled = false.
api_key = "${OPENWEATHER_API_KEY}"

# --- cost control -------------------------------------------------------
# The auto-shutoff point: reserving past this refuses the call.
#
# 800, not 1000. Two reasons. First, our count and OpenWeather's can drift —
# a transport-layer retry or a call that fails after leaving this process is
# billed by them and may not be counted by us — so the stop belongs on OUR
# side of the paid boundary. Second, lazy loading puts realistic usage near
# ~128 calls/day, so the remaining headroom costs nothing and buys real
# protection against a render loop or retry storm.
daily_call_budget = 800

# false ⇒ daily_call_budget is a HARD STOP and the free tier can never be
# exceeded. true ⇒ calls continue past it up to daily_call_hard_ceiling and
# OpenWeather bills the difference. Overage is never unbounded: there is no
# configuration in which this integration can spend without a ceiling.
allow_paid_overage = false
daily_call_hard_ceiling = 2000

# Geocoding calls count against the budget. OpenWeather does not publicly
# document the Geocoding API as exempt from the One Call quota, so the safe
# assumption is that it is not. If confirmed exempt, flip to false and the
# budget stretches further.
count_geocoding_calls = true

# --- cache TTLs: the real cost lever ------------------------------------
# One Call 4.0 bills each timeline endpoint separately, so each gets the
# longest TTL its data tolerates. current is 15 (the provider itself only
# refreshes every ~10); an hourly strip and a daily high/low move far more
# slowly than a thermometer does.
current_ttl_minutes = 15
hourly_ttl_minutes  = 60
daily_ttl_minutes   = 180
geocoding_ttl_days  = 30   # a city's coordinates do not move

# --- product knobs ------------------------------------------------------
max_locations = 5
# false ⇒ the tile fetches only the location being viewed (see the SOW's
# Algorithms section). true ⇒ it fans out one GET /weather per saved location
# on mount, trading ~5× the provider calls for instant swipes. Client fetch
# pattern only — the API contract and the budget accounting are identical
# either way.
eager_load_all_locations = false

# Capture historical conditions on activity import. false ⇒ no import-time
# provider calls and no new activity_weather rows; existing rows still render.
# The master `enabled` switch above gates this too — false there disables
# capture regardless of this value. Separate from `enabled` because the failure
# modes differ: `enabled = false` is "the vendor integration is off", this is
# "stop capturing but keep the tile working" — what an operator wants during a
# backfill that needs the whole day's budget.
capture_activity_weather = true

[vectormemory]
# Seeds the Agent Vector Memory feature (sows/agent-vector-memory.md).
# Master kill-switch: false ⇒ no distillation, no retrieval, no behavior change.
enabled = true
# Secrets → env.
openai_api_key = "${OPENAI_API_KEY}"
anthropic_api_key = "${ANTHROPIC_API_KEY}"
# Tuning knobs (public), calibrated 2026-06-21 via the admin probe
# (POST /admin/memories/search, full sweep). On real distilled memories,
# relevant hits clustered <=~0.68 and noise began >=~0.77, leaving a clean
# gap; near-duplicates sat at ~0.28 and the first distinct fact at ~0.51.
# Retrieval semantics: 0 = no cap (inject top_k unconditionally), so these
# replace the unset 0.0 with the real relevance/dedup gates.
#   distance_threshold: relevance cap — exclude matches farther than this.
#   dedup_threshold:    write-time skip — drop observations nearer than this
#                       to an existing one (0 disables dedup entirely).
distance_threshold = 0.70
dedup_threshold = 0.40
top_k = 5
session_idle_minutes = 30
# A workout with no edit for this long is eligible for note distillation.
# Separate from session_idle_minutes because a log settles faster than a chat.
workout_settle_minutes = 10
# Same idea for an endurance session's note (run/hike/walk/ride). Its own knob
# because that note is usually one short write typed straight after the
# session, so it settles faster still.
activity_settle_minutes = 10
distill_model = "claude-haiku-4-5-20251001"
embed_model = "text-embedding-3-small"
embed_dim = 1536

[hr_zones]
# Tunables for the running heart-rate-zone engine (internal/hrzones). Public
# literals — not secrets, not env-overridden. population_default_max_hr seeds
# the cold-start reference; calibrated_run_threshold is the run count at which
# the recent-runs p99 is trusted; recency_window_days bounds the history
# considered; min/max_reference_bpm clamp the estimate to a plausible band.
population_default_max_hr = 190
calibrated_run_threshold  = 5
recency_window_days       = 90
min_reference_bpm         = 100
max_reference_bpm         = 230
# Ascending interior zone bounds as fractions of max HR; zone_names has one
# more entry than zone_upper_bounds (the open-ended top zone).
zone_upper_bounds         = [0.60, 0.70, 0.80, 0.90]
zone_names                = ["Recovery", "Aerobic", "Tempo", "Threshold", "VO2max"]

[recovery]
# Tunables for the dashboard recovery trend engine (internal/recoverytrend).
# Public literals — not secrets, not env-overridden. Thresholds are derived
# PER USER from their own HRV spread; these knobs shape that derivation, they
# are not population constants a user's numbers are compared against.
#
# baseline_window_days: trailing local days behind every average. EXCLUDES
#   today, so a day is measured against history, not a window it is inside.
# min_baseline_days: non-null samples required before an average is emitted at
#   all. Below it the payload reports the count and a null average — an honest
#   "calibrating" state rather than a confident number backed by a few nights.
# trend_window_days / min_trend_days: the near-term window (INCLUDING today)
#   whose mean is compared against the baseline, and its minimum sample count.
# balanced_z: half-width of the balanced band in the user's own standard
#   deviations. 1.0 puts ~two-thirds of a typical athlete's own days inside it
#   — "balanced" should describe an ordinary morning, not a rare one.
# trend_z: how far the recent mean must sit off baseline to read rising or
#   falling. Below balanced_z because a sustained 7-day shift is a stronger
#   signal than one morning's reading.
# min_std_dev_ms: floor on the standard deviation used as the divisor, so a
#   near-flat history cannot produce an unbounded z-score.
# baseline_drift_days: how far back today's baseline is compared against to
#   decide whether the athlete's normal range is rising or falling. 28 gives a
#   four-week read, matching the window a training block is judged over. MUST be
#   strictly less than baseline_window_days — the series only reaches back that
#   far, and a larger value yields direction = "unknown" (honest, but useless).
# baseline_drift_z: how far the baseline must have moved, in the athlete's OWN
#   current standard deviations, to read rising or falling rather than steady.
#   Below trend_z because a baseline shift is a slower, more considered signal
#   than a week's mean moving: by the time a 30-day average has shifted a third
#   of an SD, something real has changed.
# page_window_max_days: the widest charted window GET /recovery/history will
#   serve, and the default span when `since` is omitted. It sizes the response,
#   not the truth — a longer history is still stored, it just takes a second
#   request. 1825 is five years, comfortably past any current user's Whoop
#   history and still ~450 KB of enriched JSON at worst.
baseline_window_days = 30
min_baseline_days    = 14
trend_window_days    = 7
min_trend_days       = 4
balanced_z           = 1.0
trend_z              = 0.5
min_std_dev_ms       = 1.0
baseline_drift_days  = 28
baseline_drift_z     = 0.35
page_window_max_days = 1825
